name: Selin AI Continuous Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloud.ru Bare Metal VM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME || 'ubuntu' }}
          key: ${{ secrets.VM_SSH_KEY }}
          passphrase: ${{ secrets.VM_SSH_PASSPHRASE || '' }}
          port: ${{ secrets.VM_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 [Deploy] Starting automatic deployment on VM..."
            cd /services/selin-ai || cd /app || cd ~/selin-ai

            echo "📦 [Deploy] Pulling latest changes from main branch..."
            git reset --hard HEAD
            git pull origin main

            echo "🔨 [Deploy] Rebuilding Docker containers without cache..."
            sudo docker compose down
            sudo docker compose build --no-cache selin-ai
            sudo docker compose up -d

            echo "🧹 [Deploy] Pruning dangling images..."
            sudo docker image prune -f

            echo "✅ [Deploy] Checking container status..."
            sudo docker ps --filter "name=selin-ai"
