# Automated CI/CD pipeline for Selin AI VM (Production Ready)
name: Deploy Selin AI to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Remote VM via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST || secrets.HOST }}
          username: ${{ secrets.VM_USERNAME || secrets.USERNAME || 'ubuntu' }}
          key: ${{ secrets.VM_SSH_KEY || secrets.SSH_KEY }}
          script: |
            cd /services/selin-ai
            sudo git reset --hard origin/main
            sudo git pull origin main
            sudo docker compose build --no-cache selin-ai
            sudo docker compose up -d selin-ai
